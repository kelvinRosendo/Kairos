spring:
  application:
    name: kairos
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kairos}
    username: ${DB_USER:kairos}
    password: ${DB_PASSWORD:kairos}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
